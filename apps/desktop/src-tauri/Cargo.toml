[package]
name = "spindeck-desktop"
version = "0.1.0"
description = "SpinDeck desktop application"
authors = ["Cherry Fu"]
edition = "2021"

[[bin]]
name = "SpinDeck"
path = "src/main.rs"

[lib]
name = "spindeck_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "fs"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "cookies"] }
url = "2"
base64 = "0.22"
regex = "1"
once_cell = "1"
mime_guess = "2"
bytes = "1"
http-body-util = "0.1"
futures = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
